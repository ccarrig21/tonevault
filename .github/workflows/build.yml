name: Build IPA
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  release: { types: [published] }

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Tools
        run: brew install xcodegen ldid
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project ToneVault.xcodeproj -scheme ToneVault \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 60
      - name: Package IPA (keeps entitlements for re-signing)
        run: |
          APP=build/Build/Products/Release-iphoneos/ToneVault.app
          GROUP=$(grep -o 'group\.[A-Za-z0-9.]*' Sources/Shared/Config.swift | head -1)
          echo "App group: $GROUP"
          cat > "$RUNNER_TEMP/ent.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.application-groups</key><array><string>$GROUP</string></array>
          </dict></plist>
          EOF
          find "$APP" -maxdepth 3 | head -40
          APPEX=$(find "$APP/PlugIns" -name "*.appex" -maxdepth 1 | head -1)
          APPEX_EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APPEX/Info.plist")
          APP_EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          ldid -S"$RUNNER_TEMP/ent.plist" "$APPEX/$APPEX_EXE"
          ldid -S"$RUNNER_TEMP/ent.plist" "$APP/$APP_EXE"
          mkdir Payload && cp -R "$APP" Payload/ && zip -qry ToneVault.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ToneVault-ipa, path: ToneVault.ipa }
      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" ToneVault.ipa --clobber
        env: { GH_TOKEN: "${{ github.token }}" }
